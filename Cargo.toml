[package]
name = "comic-editor"
version = "0.2.0"
description = "Manage, tag and compress CBZ/CBR comic libraries"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "unstable-locales"] }
directories = "6.0.0"
eframe = { version = "0.36.2", features = ["persistence"] }
egui = "0.36.2"
egui_extras = { version = "0.36.2", features = ["http", "image"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "avif-native"] }
pure-rust-locales = "0.8"
rayon = "1.12.0"
rfd = "0.17.2"
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3.2"
tempfile = "3.27.0"
trash = "5.2.9"
ureq = { version = "3.4.2", features = ["json"] }
walkdir = "2.5.0"
zip = "8.6.0"

[profile.release]
# Smaller, slightly faster binary for installed builds.
lto = "thin"
strip = true

[profile.dev]
# Line numbers in backtraces are enough; full debug info made target/ huge.
debug = "line-tables-only"

[profile.dev.package."*"]
# No debug info for dependencies, but optimise them so debug builds of the
# app (image decoding, zip, SQLite) aren't painfully slow.
debug = false
opt-level = 2
